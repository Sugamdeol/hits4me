# Koyeb app spec - FeelingSurf Viewer (https://hub.docker.com/r/feelingsurf/viewer).
# Pulls the official image directly; no custom Dockerfile needed.
# Docs: https://www.koyeb.com/docs/reference/koyeb-yaml

app:
  name: feelingsurf-viewer
services:
  - name: viewer
    type: web
    instance_type: nano
    regions:
      - was
    image:
      name: feelingsurf/viewer
      tag: stable
    ports:
      - port: 3000
        path: /
    health_checks:
      - port: 3000
        http:
          path: /
          method: GET
        interval: 30
        timeout: 5
        unhealthy_threshold: 3
        healthy_threshold: 1
    env:
      # Required - set in Koyeb dashboard as a secret.
      # Get one at https://www.feelingsurf.fr/member (Profile -> API token).
      - key: access_token
        value: ""
