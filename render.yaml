# Render Blueprint - deploys BOTH the 9Hits viewer AND the FeelingSurf viewer
# as separate services on Render via a single blueprint.
#
# When this PR merges to main, Render auto-deploys:
#   1. 9hits-viewer  (web)     - the managed 9Hits viewer on port 10000
#   2. feelingsurf-viewer (bg) - the auto-surf FeelingSurf viewer (port 3000)
#
# ACCESS_KEY is prompted as a secret during the first deploy.
# access_token is pre-configured below.
#
#   ACCESS_KEY  -> https://panel.9hits.com/user/profile
#
# Docs: https://render.com/docs/blueprint-spec

services:
  # ---------------------------------------------------------------------------
  # 9Hits Viewer (web) — runs the full 9Hits viewer with proxy/pool support
  # ---------------------------------------------------------------------------
  - type: web
    name: 9hits-viewer
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      # Prompted as a secret when the blueprint is applied.
      - key: ACCESS_KEY
        sync: false

      # ---- viewer configuration (see README.md) ----
      - key: CLEAR_ALL_SESSIONS
        value: "yes"
      - key: SYSTEM_SESSION
        value: "yes"
      - key: SESSION_NOTE
        value: "my-proxies"
      - key: HIDE_BROWSER
        value: "yes"
      - key: ALLOW_POPUPS
        value: "no"
      - key: ALLOW_ADULT
        value: "yes"
      - key: ALLOW_CRYPTO
        value: "yes"
      - key: CACHE_LIMIT
        value: "0"
      - key: RESET_INTERVAL
        value: "2h"
      - key: NOTE
        value: "render"

      # Option A: Static proxy list (5-6 sessions recommended for 512 MB free tier)
      # - key: BULK_ADD_PROXY_TYPE
      #   value: "socks5"
      # - key: BULK_ADD_PROXY_LIST
      #   value: "1.2.3.4:1080;user;pass|1.2.3.5:1080;user;pass|..."

      # Option A+: Fetch proxy list on boot (e.g. Webshare download link)
      # - key: BULK_ADD_PROXY_LIST_URL
      #   value: "https://proxy.webshare.io/api/v2/proxy/list/download/TOKEN/-/any/username/direct/-/"

      # Option B: External proxy pool (configured at https://dash.9hits.com/pool)
      # - key: EX_PROXY_SESSIONS
      #   value: "5"
      # - key: EX_PROXY_URL
      #   value: "https://dash.9hits.com/pool/YOUR_POOL_KEY"

      # ---- container knobs ----
      - key: SUPERVISOR_DELAY
        value: "10"
      - key: PORT
        value: "10000"

  # ---------------------------------------------------------------------------
  # FeelingSurf Viewer (background) — auto-surf viewer, one env var, done.
  #
  # Type: background worker (not web) so the free Render plan's 1-web-service
  # slot stays with 9Hits, while this uses the free plan's 1-background slot.
  # Render automatically respects the container's built-in Docker HEALTHCHECK
  # (http://localhost:3000) and restarts it on failure.
  #
  # If you're on a paid plan you can change `type: background` to `type: web`
  # and set `healthCheckPath: /`.
  # ---------------------------------------------------------------------------
  - type: background
    name: feelingsurf-viewer
    runtime: image
    plan: free
    image:
      url: feelingsurf/viewer:stable
    envVars:
      - key: access_token
        value: "27f77ef00e768cdbdc7352f3456e35b5"