# One Render service/container running both 9Hits and FeelingSurf.
services:
  - type: web
    name: hits4me-viewers
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      # Render prompts for the 9Hits key; FeelingSurf is preconfigured below.
      - key: ACCESS_KEY
        sync: false
      - key: ACCESS_TOKEN
        value: "27f77ef00e768cdbdc7352f3456e35b5"

      - key: PORT
        value: "10000"
      - key: FEELINGSURF_ENABLED
        value: "yes"
      - key: CLEAR_ALL_SESSIONS
        value: "yes"
      - key: SYSTEM_SESSION
        value: "yes"
      - key: SESSION_NOTE
        value: "render-system"
      - key: NOTE
        value: "render"
      - key: HIDE_BROWSER
        value: "yes"
      - key: ALLOW_POPUPS
        value: "no"
      - key: ALLOW_ADULT
        value: "no"
      - key: ALLOW_CRYPTO
        value: "no"
      - key: CACHE_LIMIT
        value: "0"
      - key: RESET_INTERVAL
        value: "2h"
      - key: SUPERVISOR_DELAY
        value: "10"
