# Updates the existing 9hits-viewer Render service so one container runs
# both 9Hits and FeelingSurf. Do not rename this service — a different
# Blueprint name would create a second deployment instead of updating
# https://dashboard.render.com/web/srv-da09a7dbedkc73a829cg
services:
  - type: web
    name: 9hits-viewer
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      # Render prompts for the 9Hits key; FeelingSurf is preconfigured below.
      - key: ACCESS_KEY
        sync: false
      - key: ACCESS_TOKEN
        value: "27f77ef00e768cdbdc7352f3456e35b5"

      - key: PORT
        value: "10000"
      # NOTE: 9Hits v6 (post Aug-2026, current Chromium) recommends >= 2 GB RAM.
      # On the 512 MB free plan both viewers together may OOM-crash. If that
      # happens, set FEELINGSURF_ENABLED=no here and run FeelingSurf as its
      # own separate free web service.
      - key: FEELINGSURF_ENABLED
        value: "yes"
      - key: CLEAR_ALL_SESSIONS
        value: "yes"
      - key: SYSTEM_SESSION
        value: "yes"
      - key: SESSION_NOTE
        value: "render-system"
      - key: NOTE
        value: "render"
      - key: HIDE_BROWSER
        value: "yes"
      - key: ALLOW_POPUPS
        value: "no"
      - key: ALLOW_ADULT
        value: "no"
      - key: ALLOW_CRYPTO
        value: "no"
      - key: CACHE_LIMIT
        value: "0"
      - key: RESET_INTERVAL
        value: "2h"
      - key: SUPERVISOR_DELAY
        value: "10"
