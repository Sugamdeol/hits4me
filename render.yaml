# Updates the existing 9hits-viewer Render service so one container runs
# both 9Hits and FeelingSurf. Do not rename this service — a different
# Blueprint name would create a second deployment instead of updating
# https://dashboard.render.com/web/srv-da09a7dbedkc73a829cg
services:
  - type: web
    name: 9hits-viewer
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      # Render prompts for the 9Hits key; FeelingSurf is preconfigured below.
      - key: ACCESS_KEY
        sync: false
      - key: ACCESS_TOKEN
        value: "27f77ef00e768cdbdc7352f3456e35b5"

      - key: PORT
        value: "10000"
      # 9Hits is OFF by default: two Chromium viewers (9Hits v6 + FeelingSurf)
      # together OOM the 512 MB free plan ("Ran out of memory (used over 512MB)"
      # every ~1 min). With NINEHITS_ENABLED=no (default) this service runs
      # FeelingSurf-only + /health and fits in 512 MB. To enable 9Hits, set
      # NINEHITS_ENABLED=yes AND prefer FEELINGSURF_ENABLED=no, or upgrade to
      # a plan with >= 2 GB RAM.
      - key: NINEHITS_ENABLED
        value: "no"
      - key: FEELINGSURF_ENABLED
        value: "yes"
      - key: CLEAR_ALL_SESSIONS
        value: "yes"
      - key: SYSTEM_SESSION
        value: "yes"
      - key: SESSION_NOTE
        value: "render-system"
      - key: NOTE
        value: "render"
      - key: HIDE_BROWSER
        value: "yes"
      - key: ALLOW_POPUPS
        value: "no"
      - key: ALLOW_ADULT
        value: "no"
      - key: ALLOW_CRYPTO
        value: "no"
      - key: CACHE_LIMIT
        value: "0"
      - key: RESET_INTERVAL
        value: "2h"
      - key: SUPERVISOR_DELAY
        value: "10"
