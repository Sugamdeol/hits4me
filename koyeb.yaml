# Koyeb App Specification
# Docs: https://www.koyeb.com/docs/reference/koyeb-yaml

app:
  name: hits4me-9hits
services:
  - name: viewer
    type: web
    instance_type: nano
    regions:
      - was
    docker:
      dockerfile: Dockerfile
    ports:
      - port: 10000
        path: /
    health_checks:
      - port: 10000
        http:
          path: /health
          method: GET
        interval: 30
        timeout: 5
        unhealthy_threshold: 3
        healthy_threshold: 1
    env:
      - key: PORT
        value: "10000"
      # 9Hits access key (hard-coded). FeelingSurf runs in its own separate
      # deployment; this service is 9Hits-only.
      - key: ACCESS_KEY
        value: "23f9097a8d823267188c49b3cc0598b1"
      # Koyeb nano = 512 MB. 9Hits-only: FEELINGSURF_ENABLED=no,
      # DUAL_VIEWER_MODE=off. LOW_MEMORY=extreme (--single-process) is NOT used
      # here because it crashes with code 133 on small instances; balanced is
      # the safe default. NH_MAX_MEMORY_MB restarts 9Hits if it runs away.
      - key: NINEHITS_ENABLED
        value: "yes"
      - key: FEELINGSURF_ENABLED
        value: "no"
      - key: DUAL_VIEWER_MODE
        value: "off"
      - key: LOW_MEMORY
        value: "balanced"
      - key: NH_SP
        value: "no"
      - key: NH_MAX_MEMORY_MB
        value: "400"
      - key: CLEAR_ALL_SESSIONS
        value: "yes"
      - key: SYSTEM_SESSION
        value: "yes"
      - key: SESSION_NOTE
        value: "koyeb-system"
      - key: NOTE
        value: "koyeb"
      - key: HIDE_BROWSER
        value: "yes"
      - key: ALLOW_POPUPS
        value: "no"
      - key: ALLOW_ADULT
        value: "no"
      - key: ALLOW_CRYPTO
        value: "no"
      - key: CACHE_LIMIT
        value: "0"
      - key: RESET_INTERVAL
        value: "2h"
      - key: SUPERVISOR_DELAY
        value: "10"
