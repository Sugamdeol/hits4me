# Multi-viewer free platform setup (9Hits + FeelingSurf).
#
# Backwards-compatible: `docker compose up -d` still starts only the
# `9hits` service. Add `--profile feelingsurf` to also start the
# FeelingSurf viewer, either alone or alongside 9Hits:
#
#   docker compose up -d                                   # 9Hits only (default)
#   docker compose --profile feelingsurf up -d             # both viewers
#   docker compose --profile feelingsurf up -d feelingsurf # feelingsurf alone
#   docker compose --profile feelingsurf up -d 9hits       # ... etc
#
# Step-by-step:
#   1. cp .env.example .env
#   2. edit .env and set ACCESS_KEY (9Hits) and/or ACCESS_TOKEN (FeelingSurf)
#   3. docker compose up -d   (add `--profile feelingsurf` for the second viewer)
#   4. curl http://localhost:10000/health   (9Hits health)
#      curl http://localhost:3000/          (FeelingSurf viewer dashboard / health)
#
# Access token:
#   * ACCESS_KEY  -> https://panel.9hits.com/user/profile
#   * ACCESS_TOKEN -> https://www.feelingsurf.fr/member (Profile / Settings)
services:
  9hits:
    # No profile -> always started with `docker compose up -d`.
    build: .
    shm_size: 2g
    ports:
      - "10000:10000"
    environment:
      PORT: "10000"
      ACCESS_KEY: "${ACCESS_KEY:-}"
      CLEAR_ALL_SESSIONS: "${CLEAR_ALL_SESSIONS:-yes}"
      SYSTEM_SESSION: "${SYSTEM_SESSION:-no}"
      SESSION_NOTE: "${SESSION_NOTE:-my-proxies}"
      BULK_ADD_PROXY_TYPE: "${BULK_ADD_PROXY_TYPE:-}"
      BULK_ADD_PROXY_LIST: "${BULK_ADD_PROXY_LIST:-}"
      BULK_ADD_PROXY_LIST_URL: "${BULK_ADD_PROXY_LIST_URL:-}"
      EX_PROXY_SESSIONS: "${EX_PROXY_SESSIONS:-}"
      EX_PROXY_URL: "${EX_PROXY_URL:-}"
      ALLOW_POPUPS: "${ALLOW_POPUPS:-no}"
      ALLOW_ADULT: "${ALLOW_ADULT:-no}"
      ALLOW_CRYPTO: "${ALLOW_CRYPTO:-no}"
      HIDE_BROWSER: "${HIDE_BROWSER:-yes}"
      CACHE_LIMIT: "${CACHE_LIMIT:-0}"
      RESET_INTERVAL: "${RESET_INTERVAL:-2h}"
      NOTE: "${NOTE:-local}"
      SUPERVISOR_DELAY: "10"
    restart: unless-stopped

  feelingsurf:
    # Opt-in via `--profile feelingsurf`. Uses the official image.
    profiles: ["feelingsurf"]
    image: feelingsurf/viewer:stable
    container_name: feelingsurf-viewer
    ports:
      - "3000:3000"   # in-viewer HTTP endpoint (used for Docker healthcheck too)
    # Both /tmp and /dev/shm are tmpfs-backed, matching the official
    # `docker run --tmpfs /tmp --tmpfs /dev/shm` recipe. Electron/Chromium
    # inside the viewer uses /dev/shm for shared memory (recommended size
    # on this image: ~2 GB). /tmp is host tmpfs that Xvfb/Electron scratch
    # into - 512 MB is plenty.
    tmpfs:
      - /tmp:size=512m,mode=1777
      - /dev/shm:size=2g,mode=1777
    environment:
      access_token: "${ACCESS_TOKEN:-}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000 || exit 1"]
      interval: 1m
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped
