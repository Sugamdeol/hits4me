# Local testing (same image Render builds):
#   1. copy .env.example to .env and set ACCESS_KEY
#   2. docker compose up --build
#   3. curl http://localhost:10000/health
services:
  9hits:
    build: .
    shm_size: 2g
    ports:
      - "10000:10000"
    environment:
      PORT: "10000"
      ACCESS_KEY: "${ACCESS_KEY:-}"
      CLEAR_ALL_SESSIONS: "${CLEAR_ALL_SESSIONS:-yes}"
      SYSTEM_SESSION: "${SYSTEM_SESSION:-no}"
      SESSION_NOTE: "${SESSION_NOTE:-my-proxies}"
      BULK_ADD_PROXY_TYPE: "${BULK_ADD_PROXY_TYPE:-}"
      BULK_ADD_PROXY_LIST: "${BULK_ADD_PROXY_LIST:-}"
      BULK_ADD_PROXY_LIST_URL: "${BULK_ADD_PROXY_LIST_URL:-}"
      EX_PROXY_SESSIONS: "${EX_PROXY_SESSIONS:-}"
      EX_PROXY_URL: "${EX_PROXY_URL:-}"
      ALLOW_POPUPS: "${ALLOW_POPUPS:-no}"
      ALLOW_ADULT: "${ALLOW_ADULT:-no}"
      ALLOW_CRYPTO: "${ALLOW_CRYPTO:-no}"
      HIDE_BROWSER: "${HIDE_BROWSER:-yes}"
      CACHE_LIMIT: "${CACHE_LIMIT:-0}"
      RESET_INTERVAL: "${RESET_INTERVAL:-2h}"
      NOTE: "${NOTE:-local}"
      SUPERVISOR_DELAY: "10"
    restart: unless-stopped
