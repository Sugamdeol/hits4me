# fly.toml app configuration for the 9Hits deployment (9Hits only).
# Docs: https://fly.io/docs/reference/configuration/

app = "hits4me-9hits"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "10000"
  # 9Hits access key baked in by default - no manual `fly secrets set` needed.
  ACCESS_KEY = "23f9097a8d823267188c49b3cc0598b1"
  # Optional: point the keep-alive pinger at your separate FeelingSurf service.
  FEELINGSURF_URL = "https://your-feelingsurf-service.example.com"
  FEELINGSURF_PING_INTERVAL = "300"
  # 9Hits-only deployment. FeelingSurf runs in its own separate deployment
  # (Dockerfile.feelingsurf). 4 GB below is plenty for the single viewer.
  NINEHITS_ENABLED = "yes"
  FEELINGSURF_ENABLED = "no"
  DUAL_VIEWER_MODE = "off"
  LOW_MEMORY = "auto"               # auto: flags off on a 4 GB box
  CLEAR_ALL_SESSIONS = "yes"
  SYSTEM_SESSION = "yes"
  SESSION_NOTE = "fly-system"
  NOTE = "fly"
  HIDE_BROWSER = "yes"
  ALLOW_POPUPS = "no"
  ALLOW_ADULT = "no"
  ALLOW_CRYPTO = "no"
  CACHE_LIMIT = "0"
  RESET_INTERVAL = "2h"
  SUPERVISOR_DELAY = "10"

[http_service]
  internal_port = 10000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 50

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/health"

[[vm]]
  # A single Chromium-based viewer runs comfortably in 4 GB.
  memory = "4gb"
  cpu_kind = "shared"
  cpus = 2
