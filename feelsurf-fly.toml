# fly.io app configuration - FeelingSurf Viewer.
# Deploys the official feelingsurf/viewer:stable image directly.
# Docs: https://fly.io/docs/reference/configuration/

app = "feelingsurf-viewer"
primary_region = "iad"

[build]
  image = "feelingsurf/viewer:stable"

[env]
  # `access_token` is set as a secret:
  #   fly secrets set access_token="<your-token>"
  healthcheck = "true"
  healthcheck_port = "3000"

[mounts]
  # tmpfs mounts make /tmp and /dev/shm RAM-backed (recommended by the
  # official repo: https://github.com/feelingsurf/docker-viewer).
  source = "tmp"
  destination = "/tmp"

# Run an in-VM swap so the 256 MB free-tier VM can host a 2 GB container
# without OOM. Adjust as needed for share-cpu-2x (512 MB).
[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024

  [vm.swap]
    size_mb = 512

[[services]]
  internal_port = 3000
  protocol = "tcp"
  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true
  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.tcp_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"

  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/"
